[project]
name = 'affordable-housing-development-contract'
description = 'Smart contract system for transparent affordable housing development through community engagement and financial coordination'
authors = ['adehada974']
telemetry = true
cache_dir = './.cache'
requirements = []
[contracts.community-engagement]
path = 'contracts/community-engagement.clar'
clarity_version = 2
epoch = 2.5

[contracts.financing-coordination]
path = 'contracts/financing-coordination.clar'
clarity_version = 2
epoch = 2.5
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
